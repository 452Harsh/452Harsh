<svg width="600" height="320" viewBox="0 0 600 320" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Wadhwani Sherke &amp; Co. project card">
  <defs>
    <linearGradient id="mg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#00E5FF"/>
      <stop offset="1" stop-color="#58A6FF"/>
    </linearGradient>
    <filter id="pglow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="44"/></filter>
    <clipPath id="pclip"><rect width="600" height="320" rx="20"/></clipPath>
  </defs>
  <style>
    .f { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .spin { animation: spin 22s linear infinite; }
    .spinrev { animation: spin 34s linear infinite reverse; }
    @keyframes spin { to { transform: rotate(360deg) } }
    .breathe { animation: breathe 3.2s ease-in-out infinite; }
    @keyframes breathe { 0%,100% { opacity: .45 } 50% { opacity: 1 } }
    .eq { animation: eq 1.6s ease-in-out infinite alternate; }
    @keyframes eq { from { transform: scaleY(.35) } to { transform: scaleY(1) } }
    .rise { animation: rise 1.2s cubic-bezier(.22,1,.36,1) both; }
    @keyframes rise { from { transform: scaleY(0) } to { transform: scaleY(1) } }
    .hop { animation: hop 5s ease-in-out infinite; }
    @keyframes hop { 0%, 35% { transform: translate(0, 0); opacity: 1 } 45% { opacity: 0 } 50% { transform: translate(62px, -6px); opacity: 0 } 60% { opacity: 1 } 85%, 100% { transform: translate(62px, -6px); opacity: 1 } }
  </style>
  <g clip-path="url(#pclip)">
    <rect width="600" height="320" fill="#0D1117"/>
    <ellipse cx="510" cy="350" rx="260" ry="150" fill="#00E5FF" opacity="0.2" filter="url(#pglow)"/>
    <ellipse cx="560" cy="30" rx="180" ry="110" fill="#58A6FF" opacity="0.1" filter="url(#pglow)"/>

    <text x="32" y="52" class="f" font-size="13" font-weight="700" letter-spacing="4" fill="#8B949E">FEATURED / 03</text>
    <rect x="506" y="32" width="62" height="28" rx="14" fill="#F0F6FC" fill-opacity="0.05" stroke="#58A6FF" stroke-opacity="0.5"/>
    <circle class="breathe" cx="521" cy="46" r="3.5" fill="#58A6FF"/>
    <text x="532" y="50.5" class="f" font-size="11.5" font-weight="700" letter-spacing="1.5" fill="#58A6FF">LIVE</text>

    <text x="32" y="130" class="f" font-size="30" font-weight="800" letter-spacing="-0.5" fill="#F0F6FC">Wadhwani Sherke &amp; Co.</text>
    <text x="32" y="168" class="f" font-size="14.5" fill="#8B949E">Full-stack site for a Chartered Accountancy</text>
    <text x="32" y="190" class="f" font-size="14.5" fill="#8B949E">firm — auth, email flows, PDF generation.</text>

    <rect x="32" y="252" width="76" height="30" rx="15" fill="#F0F6FC" fill-opacity="0.05" stroke="#F0F6FC" stroke-opacity="0.14"/><text x="70" y="271.5" text-anchor="middle" class="f" font-size="12.5" font-weight="600" fill="#C9D1D9">Next.js</text><rect x="117.80000000000001" y="252" width="76" height="30" rx="15" fill="#F0F6FC" fill-opacity="0.05" stroke="#F0F6FC" stroke-opacity="0.14"/><text x="156" y="271.5" text-anchor="middle" class="f" font-size="12.5" font-weight="600" fill="#C9D1D9">MongoDB</text><rect x="203.60000000000002" y="252" width="68" height="30" rx="15" fill="#F0F6FC" fill-opacity="0.05" stroke="#F0F6FC" stroke-opacity="0.14"/><text x="238" y="271.5" text-anchor="middle" class="f" font-size="12.5" font-weight="600" fill="#C9D1D9">Resend</text>
    <line x1="396" y1="226" x2="566" y2="226" stroke="#F0F6FC" stroke-opacity="0.15" stroke-width="1.5"/>
    <rect class="rise" style="animation-delay:0.00s;transform-origin:408px 226px" x="408" y="188" width="14" height="38" rx="4" fill="url(#mg)" opacity="0.5"/>
    <rect class="rise" style="animation-delay:0.12s;transform-origin:432px 226px" x="432" y="164" width="14" height="62" rx="4" fill="url(#mg)" opacity="0.6"/>
    <rect class="rise" style="animation-delay:0.24s;transform-origin:456px 226px" x="456" y="176" width="14" height="50" rx="4" fill="url(#mg)" opacity="0.7"/>
    <rect class="rise" style="animation-delay:0.36s;transform-origin:480px 226px" x="480" y="142" width="14" height="84" rx="4" fill="url(#mg)" opacity="0.8"/>
    <rect class="rise" style="animation-delay:0.48s;transform-origin:504px 226px" x="504" y="156" width="14" height="70" rx="4" fill="url(#mg)" opacity="0.9"/>
    <rect class="rise" style="animation-delay:0.60s;transform-origin:528px 226px" x="528" y="126" width="14" height="100" rx="4" fill="url(#mg)" opacity="1.0"/>
    <rect x="0.5" y="0.5" width="599" height="319" rx="19.5" stroke="#F0F6FC" stroke-opacity="0.1"/>
  </g>
</svg>
