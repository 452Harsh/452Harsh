<svg width="1200" height="210" viewBox="0 0 1200 210" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Achievements">
  <defs>
    <linearGradient id="a1" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#58A6FF"/><stop offset="1" stop-color="#00E5FF"/></linearGradient>
    <linearGradient id="a2" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#7C3AED"/><stop offset="1" stop-color="#58A6FF"/></linearGradient>
    <linearGradient id="a3" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#00E5FF"/><stop offset="1" stop-color="#7C3AED"/></linearGradient>
    <filter id="ag" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="30"/></filter>
  </defs>
  <style>
    .f { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .in { animation: in .8s cubic-bezier(.22,1,.36,1) both; }
    .i2 { animation-delay: .18s } .i3 { animation-delay: .36s }
    @keyframes in { from { opacity: 0; transform: translateY(12px) } to { opacity: 1; transform: translateY(0) } }
    .big { font-size: 40px; font-weight: 800; letter-spacing: -1px; }
    .cap { font-size: 14px; font-weight: 700; fill: #F0F6FC; }
    .sub { font-size: 12.5px; fill: #8B949E; }
  </style>

  <g class="in">
    <rect x="10" y="15" width="380" height="180" rx="20" fill="#11161D" stroke="#F0F6FC" stroke-opacity="0.1"/>
    <ellipse cx="80" cy="20" rx="110" ry="60" fill="#58A6FF" opacity="0.12" filter="url(#ag)"/>
    <text x="42" y="92" class="f big" fill="url(#a1)">9.15</text>
    <text x="42" y="126" class="f cap">CGPA · B.E. Computer Science</text>
    <text x="42" y="150" class="f sub">VESIT, Mumbai — graduated near the top of the class</text>
  </g>

  <g class="in i2">
    <rect x="410" y="15" width="380" height="180" rx="20" fill="#11161D" stroke="#F0F6FC" stroke-opacity="0.1"/>
    <ellipse cx="480" cy="20" rx="110" ry="60" fill="#7C3AED" opacity="0.14" filter="url(#ag)"/>
    <text x="442" y="92" class="f big" fill="url(#a2)">3+</text>
    <text x="442" y="126" class="f cap">Products live in production</text>
    <text x="442" y="150" class="f sub">Portfolio, AI tools &amp; client platforms — deployed and used</text>
  </g>

  <g class="in i3">
    <rect x="810" y="15" width="380" height="180" rx="20" fill="#11161D" stroke="#F0F6FC" stroke-opacity="0.1"/>
    <ellipse cx="880" cy="20" rx="110" ry="60" fill="#00E5FF" opacity="0.1" filter="url(#ag)"/>
    <text x="842" y="92" class="f big" fill="url(#a3)">SIH</text>
    <text x="842" y="126" class="f cap">Hackathon builder</text>
    <text x="842" y="150" class="f sub">Smart India Hackathon · TezAsia — shipped under pressure</text>
  </g>
</svg>
