<svg width="1200" height="170" viewBox="0 0 1200 170" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Current focus">
  <defs>
    <linearGradient id="fg" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7C3AED"/><stop offset="0.5" stop-color="#58A6FF"/><stop offset="1" stop-color="#00E5FF"/>
    </linearGradient>
    <filter id="fglow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="40"/></filter>
    <clipPath id="fclip"><rect width="1200" height="170" rx="20"/></clipPath>
  </defs>
  <style>
    .f { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .radar { transform-origin: 96px 85px; animation: sweep 4s linear infinite; }
    @keyframes sweep { to { transform: rotate(360deg) } }
    .ping { animation: ping 4s ease-out infinite; transform-origin: 96px 85px; }
    @keyframes ping { 0% { transform: scale(.3); opacity: .8 } 70%, 100% { transform: scale(1.6); opacity: 0 } }
    .pill { animation: in .7s cubic-bezier(.22,1,.36,1) both; }
    .p2 { animation-delay: .15s } .p3 { animation-delay: .3s } .p4 { animation-delay: .45s }
    @keyframes in { from { opacity: 0; transform: translateY(10px) } to { opacity: 1; transform: translateY(0) } }
  </style>
  <g clip-path="url(#fclip)">
    <rect width="1200" height="170" fill="#11161D"/>
    <ellipse cx="1080" cy="0" rx="320" ry="120" fill="#7C3AED" opacity="0.12" filter="url(#fglow)"/>
    <ellipse cx="60" cy="170" rx="280" ry="110" fill="#00E5FF" opacity="0.08" filter="url(#fglow)"/>

    <circle cx="96" cy="85" r="42" stroke="#58A6FF" stroke-opacity="0.3" stroke-width="1"/>
    <circle cx="96" cy="85" r="27" stroke="#58A6FF" stroke-opacity="0.4" stroke-width="1"/>
    <circle class="ping" cx="96" cy="85" r="42" stroke="#00E5FF" stroke-width="1.5" fill="none"/>
    <g class="radar"><path d="M96 85 L96 43 A42 42 0 0 1 132 64 Z" fill="#58A6FF" opacity="0.35"/></g>
    <circle cx="96" cy="85" r="4" fill="#00E5FF"/>

    <text x="176" y="66" class="f" font-size="13" font-weight="700" letter-spacing="4" fill="#8B949E">CURRENTLY EXPLORING</text>
    <text x="176" y="98" class="f" font-size="21" font-weight="700" fill="#F0F6FC">The layer where AI meets product engineering</text>

    <g class="pill">
      <rect x="176" y="118" width="168" height="32" rx="16" fill="#F0F6FC" fill-opacity="0.05" stroke="#7C3AED" stroke-opacity="0.5"/>
      <text x="260" y="139" text-anchor="middle" class="f" font-size="13" font-weight="600" fill="#A78BFA">Voice AI Agents · Vapi</text>
    </g>
    <g class="pill p2">
      <rect x="356" y="118" width="128" height="32" rx="16" fill="#F0F6FC" fill-opacity="0.05" stroke="#58A6FF" stroke-opacity="0.5"/>
      <text x="420" y="139" text-anchor="middle" class="f" font-size="13" font-weight="600" fill="#58A6FF">RAG Pipelines</text>
    </g>
    <g class="pill p3">
      <rect x="496" y="118" width="120" height="32" rx="16" fill="#F0F6FC" fill-opacity="0.05" stroke="#00E5FF" stroke-opacity="0.5"/>
      <text x="556" y="139" text-anchor="middle" class="f" font-size="13" font-weight="600" fill="#00E5FF">LLM Tooling</text>
    </g>
    <g class="pill p4">
      <rect x="628" y="118" width="196" height="32" rx="16" fill="#F0F6FC" fill-opacity="0.05" stroke="#F0F6FC" stroke-opacity="0.2"/>
      <text x="726" y="139" text-anchor="middle" class="f" font-size="13" font-weight="600" fill="#C9D1D9">AI-powered Shopify apps</text>
    </g>

    <rect x="0.5" y="0.5" width="1199" height="169" rx="19.5" stroke="url(#fg)" stroke-opacity="0.35"/>
  </g>
</svg>
