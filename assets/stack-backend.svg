<svg width="380" height="306" viewBox="0 0 380 306" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Backend skills">
  <defs>
    <linearGradient id="bar1" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#7C3AED"/>
      <stop offset="1" stop-color="#58A6FF"/>
    </linearGradient>
    <filter id="glow1" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="34"/>
    </filter>
    <clipPath id="clip1"><rect width="380" height="306" rx="20"/></clipPath>
  </defs>
  <style>
    .f { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .label { font-size: 13.5px; font-weight: 600; fill: #C9D1D9; }
    .pct { font-size: 11.5px; font-weight: 500; fill: #8B949E; }
    .bar { transform-origin: 26px 0px; transform-box: view-box; animation: grow 1.4s cubic-bezier(.22,1,.36,1) both; }
    @keyframes grow { from { transform: scaleX(0) } to { transform: scaleX(1) } }
  </style>
  <g clip-path="url(#clip1)">
    <rect width="380" height="306" fill="#11161D"/>
    <ellipse cx="340" cy="10" rx="150" ry="90" fill="#7C3AED" opacity="0.16" filter="url(#glow1)"/>
    <g transform="translate(26, 30)"><rect x="0" y="0" width="22" height="8" rx="2.5" stroke="#7C3AED" stroke-width="1.8" fill="none"/><rect x="0" y="11" width="22" height="8" rx="2.5" stroke="#7C3AED" stroke-width="1.8" fill="none"/><circle cx="4.5" cy="4" r="1.3" fill="#7C3AED"/><circle cx="4.5" cy="15" r="1.3" fill="#7C3AED"/></g>
    <text x="62" y="47" class="f" font-size="19" font-weight="700" fill="#F0F6FC">Backend</text>
    <text x="26" y="82" class="f" font-size="13" fill="#8B949E">APIs built to scale</text>
    
    <g>
      <text x="26" y="118" class="f label">Node.js</text>
      <text x="354" y="118" text-anchor="end" class="f pct">90</text>
      <rect x="26" y="126" width="328" height="6" rx="3" fill="#F0F6FC" fill-opacity="0.06"/>
      <rect x="26" y="126" width="295.2" height="6" rx="3" fill="url(#bar1)" class="bar" style="animation-delay:0.00s"/>
    </g>
    <g>
      <text x="26" y="155" class="f label">Express</text>
      <text x="354" y="155" text-anchor="end" class="f pct">88</text>
      <rect x="26" y="163" width="328" height="6" rx="3" fill="#F0F6FC" fill-opacity="0.06"/>
      <rect x="26" y="163" width="288.6" height="6" rx="3" fill="url(#bar1)" class="bar" style="animation-delay:0.15s"/>
    </g>
    <g>
      <text x="26" y="192" class="f label">REST APIs</text>
      <text x="354" y="192" text-anchor="end" class="f pct">88</text>
      <rect x="26" y="200" width="328" height="6" rx="3" fill="#F0F6FC" fill-opacity="0.06"/>
      <rect x="26" y="200" width="288.6" height="6" rx="3" fill="url(#bar1)" class="bar" style="animation-delay:0.30s"/>
    </g>
    <g>
      <text x="26" y="229" class="f label">Prisma</text>
      <text x="354" y="229" text-anchor="end" class="f pct">84</text>
      <rect x="26" y="237" width="328" height="6" rx="3" fill="#F0F6FC" fill-opacity="0.06"/>
      <rect x="26" y="237" width="275.5" height="6" rx="3" fill="url(#bar1)" class="bar" style="animation-delay:0.45s"/>
    </g>
    <g>
      <text x="26" y="266" class="f label">Socket.IO</text>
      <text x="354" y="266" text-anchor="end" class="f pct">78</text>
      <rect x="26" y="274" width="328" height="6" rx="3" fill="#F0F6FC" fill-opacity="0.06"/>
      <rect x="26" y="274" width="255.8" height="6" rx="3" fill="url(#bar1)" class="bar" style="animation-delay:0.60s"/>
    </g>
    <rect x="0.5" y="0.5" width="379" height="305" rx="19.5" stroke="#F0F6FC" stroke-opacity="0.1"/>
  </g>
</svg>
