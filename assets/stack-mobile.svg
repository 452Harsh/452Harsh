<svg width="380" height="306" viewBox="0 0 380 306" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Mobile skills">
  <defs>
    <linearGradient id="bar2" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#00E5FF"/>
      <stop offset="1" stop-color="#58A6FF"/>
    </linearGradient>
    <filter id="glow2" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="34"/>
    </filter>
    <clipPath id="clip2"><rect width="380" height="306" rx="20"/></clipPath>
  </defs>
  <style>
    .f { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .label { font-size: 13.5px; font-weight: 600; fill: #C9D1D9; }
    .pct { font-size: 11.5px; font-weight: 500; fill: #8B949E; }
    .bar { transform-origin: 26px 0px; transform-box: view-box; animation: grow 1.4s cubic-bezier(.22,1,.36,1) both; }
    @keyframes grow { from { transform: scaleX(0) } to { transform: scaleX(1) } }
  </style>
  <g clip-path="url(#clip2)">
    <rect width="380" height="306" fill="#11161D"/>
    <ellipse cx="340" cy="10" rx="150" ry="90" fill="#00E5FF" opacity="0.16" filter="url(#glow2)"/>
    <g transform="translate(26, 30)"><rect x="3" y="0" width="15" height="21" rx="3.5" stroke="#00E5FF" stroke-width="1.8" fill="none"/><path d="M8.5 17.5 h4" stroke="#00E5FF" stroke-width="1.8" stroke-linecap="round"/></g>
    <text x="62" y="47" class="f" font-size="19" font-weight="700" fill="#F0F6FC">Mobile</text>
    <text x="26" y="82" class="f" font-size="13" fill="#8B949E">Native feel, one codebase</text>
    
    <g>
      <text x="26" y="126" class="f label">React Native</text>
      <text x="354" y="126" text-anchor="end" class="f pct">86</text>
      <rect x="26" y="134" width="328" height="6" rx="3" fill="#F0F6FC" fill-opacity="0.06"/>
      <rect x="26" y="134" width="282.1" height="6" rx="3" fill="url(#bar2)" class="bar" style="animation-delay:0.00s"/>
    </g>
    <g>
      <text x="26" y="169" class="f label">Expo</text>
      <text x="354" y="169" text-anchor="end" class="f pct">82</text>
      <rect x="26" y="177" width="328" height="6" rx="3" fill="#F0F6FC" fill-opacity="0.06"/>
      <rect x="26" y="177" width="269.0" height="6" rx="3" fill="url(#bar2)" class="bar" style="animation-delay:0.15s"/>
    </g>
    <g>
      <text x="26" y="212" class="f label">Push &amp; Deep Links</text>
      <text x="354" y="212" text-anchor="end" class="f pct">78</text>
      <rect x="26" y="220" width="328" height="6" rx="3" fill="#F0F6FC" fill-opacity="0.06"/>
      <rect x="26" y="220" width="255.8" height="6" rx="3" fill="url(#bar2)" class="bar" style="animation-delay:0.30s"/>
    </g>
    <g>
      <text x="26" y="255" class="f label">App Store Delivery</text>
      <text x="354" y="255" text-anchor="end" class="f pct">74</text>
      <rect x="26" y="263" width="328" height="6" rx="3" fill="#F0F6FC" fill-opacity="0.06"/>
      <rect x="26" y="263" width="242.7" height="6" rx="3" fill="url(#bar2)" class="bar" style="animation-delay:0.45s"/>
    </g>
    <rect x="0.5" y="0.5" width="379" height="305" rx="19.5" stroke="#F0F6FC" stroke-opacity="0.1"/>
  </g>
</svg>
