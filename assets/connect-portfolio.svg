    <g transform="translate(52, 58)"><circle cx="0" cy="0" r="9.5" stroke="#58A6FF" stroke-width="1.7" fill="none"/><ellipse cx="0" cy="0" rx="4.2" ry="9.5" stroke="#58A6FF" stroke-width="1.5" fill="none"/><path d="M-9 -3.2 h18 M-9 3.2 h18" stroke="#58A6FF" stroke-width="1.5"/></g>
