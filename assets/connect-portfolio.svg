      <stop stop-color="#F0F6FC" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#F0F6FC" stop-opacity="0.09"/>
      <stop offset="1" stop-color="#F0F6FC" stop-opacity="0"/>
    </linearGradient>
    <filter id="cg" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="26"/></filter>
    <clipPath id="cc"><rect width="380" height="116" rx="18"/></clipPath>
