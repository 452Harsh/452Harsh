<svg width="1200" height="640" viewBox="0 0 1200 640" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Experience timeline">
  <defs>
    <linearGradient id="spine" x1="600" y1="30" x2="600" y2="610" gradientUnits="userSpaceOnUse">
      <stop stop-color="#00E5FF"/>
      <stop offset="0.5" stop-color="#58A6FF"/>
      <stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>
  </defs>
  <style>
    .f { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .spine { stroke-dasharray: 580; stroke-dashoffset: 580; animation: draw 1.8s cubic-bezier(.4,0,.2,1) forwards; }
    @keyframes draw { to { stroke-dashoffset: 0 } }
    .node { animation: pop .5s cubic-bezier(.34,1.56,.64,1) both; }
    .n1 { animation-delay: .3s } .n2 { animation-delay: .8s } .n3 { animation-delay: 1.3s }
    @keyframes pop { from { opacity: 0 } to { opacity: 1 } }
    .card { animation: slide .7s cubic-bezier(.22,1,.36,1) both; }
    .c1 { animation-delay: .45s } .c2 { animation-delay: .95s } .c3 { animation-delay: 1.45s }
    @keyframes slide { from { opacity: 0; transform: translateY(14px) } to { opacity: 1; transform: translateY(0) } }
    .halo { animation: halo 3s ease-in-out infinite; }
    @keyframes halo { 0%,100% { opacity: .25 } 50% { opacity: .7 } }
    .title { font-size: 18px; font-weight: 700; fill: #F0F6FC; }
    .org { font-size: 14px; font-weight: 600; }
    .body { font-size: 13px; fill: #8B949E; }
    .date { font-size: 12px; font-weight: 700; letter-spacing: 2.5px; fill: #8B949E; }
  </style>

  <line class="spine" x1="600" y1="30" x2="600" y2="610" stroke="url(#spine)" stroke-width="2"/>

  <!-- Node 1 : Iterforge -->
  <g class="node n1">
    <circle class="halo" cx="600" cy="110" r="17" fill="#00E5FF" opacity="0.3"/>
    <circle cx="600" cy="110" r="8" fill="#0D1117" stroke="#00E5FF" stroke-width="2.5"/>
    <circle cx="600" cy="110" r="3" fill="#00E5FF"/>
  </g>
  <g class="card c1">
    <line x1="608" y1="110" x2="660" y2="110" stroke="#00E5FF" stroke-opacity="0.4" stroke-width="1.5"/>
    <rect x="660" y="42" width="470" height="136" rx="18" fill="#11161D" stroke="#F0F6FC" stroke-opacity="0.1"/>
    <rect x="660" y="42" width="470" height="136" rx="18" fill="#00E5FF" opacity="0.03"/>
    <text x="688" y="76" class="f date">2025 — PRESENT</text>
    <text x="688" y="104" class="f title">Software Engineer</text>
    <text x="688" y="126" class="f org" fill="#00E5FF">Iterforge Digital · Mumbai</text>
    <text x="688" y="150" class="f body">Building Shopify apps &amp; themes for production merchants,</text>
    <text x="688" y="168" class="f body">plus Angular front-ends for client platforms.</text>
  </g>

  <!-- Node 2 : Freelance -->
  <g class="node n2">
    <circle class="halo" cx="600" cy="320" r="17" fill="#58A6FF" opacity="0.3"/>
    <circle cx="600" cy="320" r="8" fill="#0D1117" stroke="#58A6FF" stroke-width="2.5"/>
    <circle cx="600" cy="320" r="3" fill="#58A6FF"/>
  </g>
  <g class="card c2">
    <line x1="540" y1="320" x2="592" y2="320" stroke="#58A6FF" stroke-opacity="0.4" stroke-width="1.5"/>
    <rect x="70" y="252" width="470" height="136" rx="18" fill="#11161D" stroke="#F0F6FC" stroke-opacity="0.1"/>
    <rect x="70" y="252" width="470" height="136" rx="18" fill="#58A6FF" opacity="0.03"/>
    <text x="98" y="286" class="f date">CLIENT WORK</text>
    <text x="98" y="314" class="f title">Freelance Full-Stack Developer</text>
    <text x="98" y="336" class="f org" fill="#58A6FF">Wadhwani Sherke &amp; Co. — Chartered Accountants</text>
    <text x="98" y="360" class="f body">Designed, built and shipped the firm's full-stack site —</text>
    <text x="98" y="378" class="f body">Next.js, MongoDB, auth, email &amp; PDF generation.</text>
  </g>

  <!-- Node 3 : VESIT -->
  <g class="node n3">
    <circle class="halo" cx="600" cy="530" r="17" fill="#7C3AED" opacity="0.3"/>
    <circle cx="600" cy="530" r="8" fill="#0D1117" stroke="#7C3AED" stroke-width="2.5"/>
    <circle cx="600" cy="530" r="3" fill="#7C3AED"/>
  </g>
  <g class="card c3">
    <line x1="608" y1="530" x2="660" y2="530" stroke="#7C3AED" stroke-opacity="0.4" stroke-width="1.5"/>
    <rect x="660" y="462" width="470" height="136" rx="18" fill="#11161D" stroke="#F0F6FC" stroke-opacity="0.1"/>
    <rect x="660" y="462" width="470" height="136" rx="18" fill="#7C3AED" opacity="0.04"/>
    <text x="688" y="496" class="f date">2021 — 2025</text>
    <text x="688" y="524" class="f title">B.E. Computer Science</text>
    <text x="688" y="546" class="f org" fill="#A78BFA">VESIT, Mumbai · CGPA 9.15</text>
    <text x="688" y="570" class="f body">Graduated near the top of the class while shipping</text>
    <text x="688" y="588" class="f body">hackathon projects — Smart India Hackathon, TezAsia.</text>
  </g>
</svg>
