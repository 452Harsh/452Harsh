<svg width="380" height="306" viewBox="0 0 380 306" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Cloud &amp; Tools skills">
  <defs>
    <linearGradient id="bar5" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#00E5FF"/>
      <stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>
    <filter id="glow5" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="34"/>
    </filter>
    <clipPath id="clip5"><rect width="380" height="306" rx="20"/></clipPath>
  </defs>
  <style>
    .f { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .label { font-size: 13.5px; font-weight: 600; fill: #C9D1D9; }
    .pct { font-size: 11.5px; font-weight: 500; fill: #8B949E; }
    .bar { transform-origin: 26px 0px; transform-box: view-box; animation: grow 1.4s cubic-bezier(.22,1,.36,1) both; }
    @keyframes grow { from { transform: scaleX(0) } to { transform: scaleX(1) } }
  </style>
  <g clip-path="url(#clip5)">
    <rect width="380" height="306" fill="#11161D"/>
    <ellipse cx="340" cy="10" rx="150" ry="90" fill="#00E5FF" opacity="0.16" filter="url(#glow5)"/>
    <g transform="translate(26, 30)"><path d="M6 19 a5.5 5.5 0 0 1 -1 -10.9 A7 7 0 0 1 18.6 9.5 A4.8 4.8 0 0 1 17.5 19 z" stroke="#00E5FF" stroke-width="1.8" fill="none" stroke-linejoin="round"/></g>
    <text x="62" y="47" class="f" font-size="19" font-weight="700" fill="#F0F6FC">Cloud &amp; Tools</text>
    <text x="26" y="82" class="f" font-size="13" fill="#8B949E">Ship fast, ship safely</text>
    
    <g>
      <text x="26" y="126" class="f label">Vercel</text>
      <text x="354" y="126" text-anchor="end" class="f pct">92</text>
      <rect x="26" y="134" width="328" height="6" rx="3" fill="#F0F6FC" fill-opacity="0.06"/>
      <rect x="26" y="134" width="301.8" height="6" rx="3" fill="url(#bar5)" class="bar" style="animation-delay:0.00s"/>
    </g>
    <g>
      <text x="26" y="169" class="f label">Git &amp; GitHub</text>
      <text x="354" y="169" text-anchor="end" class="f pct">92</text>
      <rect x="26" y="177" width="328" height="6" rx="3" fill="#F0F6FC" fill-opacity="0.06"/>
      <rect x="26" y="177" width="301.8" height="6" rx="3" fill="url(#bar5)" class="bar" style="animation-delay:0.15s"/>
    </g>
    <g>
      <text x="26" y="212" class="f label">CI / Actions</text>
      <text x="354" y="212" text-anchor="end" class="f pct">78</text>
      <rect x="26" y="220" width="328" height="6" rx="3" fill="#F0F6FC" fill-opacity="0.06"/>
      <rect x="26" y="220" width="255.8" height="6" rx="3" fill="url(#bar5)" class="bar" style="animation-delay:0.30s"/>
    </g>
    <g>
      <text x="26" y="255" class="f label">Docker</text>
      <text x="354" y="255" text-anchor="end" class="f pct">74</text>
      <rect x="26" y="263" width="328" height="6" rx="3" fill="#F0F6FC" fill-opacity="0.06"/>
      <rect x="26" y="263" width="242.7" height="6" rx="3" fill="url(#bar5)" class="bar" style="animation-delay:0.45s"/>
    </g>
    <rect x="0.5" y="0.5" width="379" height="305" rx="19.5" stroke="#F0F6FC" stroke-opacity="0.1"/>
