<svg width="380" height="306" viewBox="0 0 380 306" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Frontend skills">
  <defs>
    <linearGradient id="bar0" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#58A6FF"/>
      <stop offset="1" stop-color="#00E5FF"/>
    </linearGradient>
    <filter id="glow0" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="34"/>
    </filter>
    <clipPath id="clip0"><rect width="380" height="306" rx="20"/></clipPath>
  </defs>
  <style>
    .f { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .label { font-size: 13.5px; font-weight: 600; fill: #C9D1D9; }
    .pct { font-size: 11.5px; font-weight: 500; fill: #8B949E; }
    .bar { transform-origin: 26px 0px; transform-box: view-box; animation: grow 1.4s cubic-bezier(.22,1,.36,1) both; }
    @keyframes grow { from { transform: scaleX(0) } to { transform: scaleX(1) } }
  </style>
  <g clip-path="url(#clip0)">
    <rect width="380" height="306" fill="#11161D"/>
    <ellipse cx="340" cy="10" rx="150" ry="90" fill="#58A6FF" opacity="0.16" filter="url(#glow0)"/>
    <g transform="translate(26, 30)"><rect x="0" y="0" width="22" height="15" rx="3" stroke="#58A6FF" stroke-width="1.8" fill="none"/><path d="M7 19 h8 M11 15 v4" stroke="#58A6FF" stroke-width="1.8" stroke-linecap="round"/></g>
    <text x="62" y="47" class="f" font-size="19" font-weight="700" fill="#F0F6FC">Frontend</text>
    <text x="26" y="82" class="f" font-size="13" fill="#8B949E">Interfaces that feel effortless</text>
    
    <g>
      <text x="26" y="118" class="f label">React</text>
      <text x="354" y="118" text-anchor="end" class="f pct">95</text>
      <rect x="26" y="126" width="328" height="6" rx="3" fill="#F0F6FC" fill-opacity="0.06"/>
      <rect x="26" y="126" width="311.6" height="6" rx="3" fill="url(#bar0)" class="bar" style="animation-delay:0.00s"/>
    </g>
    <g>
      <text x="26" y="155" class="f label">Next.js</text>
      <text x="354" y="155" text-anchor="end" class="f pct">92</text>
      <rect x="26" y="163" width="328" height="6" rx="3" fill="#F0F6FC" fill-opacity="0.06"/>
      <rect x="26" y="163" width="301.8" height="6" rx="3" fill="url(#bar0)" class="bar" style="animation-delay:0.15s"/>
    </g>
    <g>
      <text x="26" y="192" class="f label">TypeScript</text>
      <text x="354" y="192" text-anchor="end" class="f pct">90</text>
      <rect x="26" y="200" width="328" height="6" rx="3" fill="#F0F6FC" fill-opacity="0.06"/>
      <rect x="26" y="200" width="295.2" height="6" rx="3" fill="url(#bar0)" class="bar" style="animation-delay:0.30s"/>
    </g>
    <g>
      <text x="26" y="229" class="f label">Tailwind CSS</text>
      <text x="354" y="229" text-anchor="end" class="f pct">88</text>
      <rect x="26" y="237" width="328" height="6" rx="3" fill="#F0F6FC" fill-opacity="0.06"/>
      <rect x="26" y="237" width="288.6" height="6" rx="3" fill="url(#bar0)" class="bar" style="animation-delay:0.45s"/>
    </g>
    <g>
      <text x="26" y="266" class="f label">Angular</text>
      <text x="354" y="266" text-anchor="end" class="f pct">80</text>
      <rect x="26" y="274" width="328" height="6" rx="3" fill="#F0F6FC" fill-opacity="0.06"/>
      <rect x="26" y="274" width="262.4" height="6" rx="3" fill="url(#bar0)" class="bar" style="animation-delay:0.60s"/>
    </g>
    <rect x="0.5" y="0.5" width="379" height="305" rx="19.5" stroke="#F0F6FC" stroke-opacity="0.1"/>
